<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두뇌 풀가동! 트리플 퀴즈 쇼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e2440;--dim:#64708f;--in:#4f46e5;--pk:#ec4899;--am:#f59e0b;--ok:#10b981;--no:#ef4444;--c1:#2563eb;--c2:#059669;--c3:#d97706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#5b52f0,#312e81 45%,#1a1740 100%) fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 20%,rgba(250,204,21,.16),transparent 40%),radial-gradient(circle at 82% 78%,rgba(236,72,153,.16),transparent 42%)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}
.jf{font-family:'Jua',sans-serif;font-weight:400}
#app{position:relative;max-width:760px;margin:0 auto;padding:14px 14px 30px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
#app.wide{max-width:1100px}
.top{display:flex;justify-content:space-between;margin-bottom:10px;min-height:38px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:7px 15px;font-weight:700;font-size:14px}
.card{background:rgba(255,255,255,.97);border:4px solid rgba(199,210,254,.7);border-radius:28px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.screen{display:none}.screen.on{display:block}
.tag{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:99px;padding:5px 16px;font-size:13px;font-weight:900}
h1{font-size:clamp(34px,7vw,52px);margin:10px 0 4px;line-height:1.15;color:#312e81}
h1 span{background:linear-gradient(90deg,#4f46e5,#9333ea,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(26px,5vw,36px);margin:0 0 4px;color:#312e81}
p.sub{color:var(--dim);margin:2px 0 18px;font-weight:500}
.center{text-align:center}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{border-radius:20px;padding:18px 10px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.mode i{font-style:normal;font-size:38px;display:block} .mode b{font-family:'Jua';font-weight:400;font-size:22px;display:block} .mode span{font-size:12px;font-weight:700;opacity:.92}
.m1{background:linear-gradient(135deg,#f59e0b,#ec4899)}.m2{background:linear-gradient(135deg,#6366f1,#9333ea)}.m3{background:linear-gradient(135deg,#06b6d4,#2563eb)}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.trio div{border-radius:14px;padding:9px 6px;font-size:13px;font-weight:700;text-align:center}
.t1{background:#dbeafe;color:#1e40af}.t2{background:#d1fae5;color:#065f46}.t3{background:#fef3c7;color:#92400e}
.btn{border-radius:16px;padding:14px;font-weight:900;font-size:17px;background:#eef0f8;color:#3b4263;box-shadow:0 5px 0 #c9cfe6;transition:transform .1s,box-shadow .1s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c9cfe6}
.btn.go{background:linear-gradient(90deg,#fbbf24,#f97316,#ec4899);color:#fff;box-shadow:0 5px 0 #b4530a;font-family:'Jua';font-weight:400;font-size:24px}
.btn.in{background:#4f46e5;color:#fff;box-shadow:0 5px 0 #3730a3}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid #dfe3f3;font-size:15px;padding:10px}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.name{width:100%;text-align:center;font-size:26px;font-weight:900;padding:14px;border-radius:16px;border:3px solid #c7d2fe;background:#f8f9ff;color:var(--ink);outline:0}
.name:focus{border-color:var(--in)}.name.need{border-color:var(--no);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
label.l{display:block;font-weight:900;font-size:14px;margin:16px 0 8px;color:#3b4263}
.seg{display:grid;gap:8px}.seg.c4{grid-template-columns:repeat(4,1fr)}.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button{border-radius:13px;padding:11px 4px;font-weight:900;font-size:14px;background:#fff;border:2px solid #dfe3f3;color:#55607f}
.seg button.on{background:var(--in);border-color:var(--in);color:#fff}
@media (max-width:520px){.seg.c4{grid-template-columns:repeat(2,1fr)}}

/* 퀴즈 */
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.badge{border-radius:99px;padding:5px 13px;font-weight:900;font-size:13px;white-space:nowrap}
.b-n{background:#1e2440;color:#fff}.cat-common{background:#dbeafe;color:#1e40af}.cat-math{background:#d1fae5;color:#065f46}.cat-dad{background:#fef3c7;color:#92400e}
.b-combo{background:linear-gradient(90deg,#f97316,#f43f5e);color:#fff;display:none}.b-combo.on{display:inline-block;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}}
.b-score{background:#eef2ff;border:1px solid #c7d2fe;color:#312e81;font-size:15px}
.timer{height:14px;background:#e3e7f3;border-radius:99px;overflow:hidden;padding:2px}
.timer i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#6366f1,#a855f7)}
.timer.mid i{background:#f59e0b}.timer.low i{background:#ef4444}
.tt{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--dim);margin-bottom:4px}
.qcard{background:#f6f7fc;border:2px solid #e3e7f3;border-radius:20px;padding:22px 18px;margin:14px 0;min-height:118px;display:grid;place-items:center;text-align:center}
.qcard small{font-size:11px;font-weight:900;letter-spacing:.2em;color:#818cf8;display:block;margin-bottom:6px}
.qtext{font-size:clamp(19px,3.4vw,26px);font-weight:900;line-height:1.45;word-break:keep-all;white-space:pre-line}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid #dfe3f3;border-radius:17px;padding:14px;font-weight:900;font-size:clamp(16px,2.4vw,19px);box-shadow:0 4px 0 #cdd3e8;transition:transform .1s,box-shadow .1s,opacity .2s;word-break:keep-all}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #cdd3e8}
.opt em{font-style:normal;width:32px;height:32px;border-radius:10px;background:#eef0f8;display:grid;place-items:center;font-size:14px;flex:none;color:#55607f}
.opt.ok{background:var(--ok);border-color:#059669;color:#fff;box-shadow:0 4px 0 #047857;animation:pop .35s}
.opt.no{background:var(--no);border-color:#dc2626;color:#fff;box-shadow:0 4px 0 #b91c1c;animation:shake .4s}
.opt.ok em,.opt.no em{background:rgba(255,255,255,.25);color:#fff}
.opt.dim{opacity:.45}.opt.gone{visibility:hidden}
.life{display:flex;gap:8px;margin-top:12px}
.life button{flex:1;border-radius:13px;padding:9px;font-weight:900;font-size:14px;background:#fff7ed;border:2px solid #fdba74;color:#9a3412}
.life button.used{opacity:.35;filter:grayscale(1)}
.fb{display:none;border-radius:18px;padding:14px 16px;margin-top:14px;border:2px solid}
.fb.on{display:block;animation:in .25s}
.fb.good{background:#ecfdf5;border-color:#6ee7b7;color:#064e3b}.fb.bad{background:#fff1f2;border-color:#fda4af;color:#881337}
.fb b{font-size:18px;display:block}.fb p{margin:4px 0 12px;font-weight:500;font-size:15px;line-height:1.55;word-break:keep-all}

/* 라운드 안내 */
.round{padding:40px 26px;text-align:center}.round .big{font-size:76px;line-height:1}
.round h2{font-size:44px;margin:8px 0}

/* 결과 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.stats div{border-radius:16px;padding:11px 4px;text-align:center;font-size:12px;font-weight:900}
.stats b{display:block;font-family:'Jua';font-weight:400;font-size:28px}
.s1{background:#eef2ff;color:#6366f1}.s1 b{color:#3730a3}.s2{background:#ecfdf5;color:#10b981}.s2 b{color:#047857}.s3{background:#fffbeb;color:#f59e0b}.s3 b{color:#b45309}
.medal{width:84px;height:84px;border-radius:26px;margin:0 auto 8px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 8px 20px rgba(249,115,22,.35)}
.me{color:#b45309;font-weight:900;font-size:18px;margin:4px 0;min-height:1em;text-align:center}
.rank{display:grid;gap:5px;max-height:34vh;overflow-y:auto;margin:8px 0}
.rank .r{display:grid;grid-template-columns:2.2em 1fr auto auto;gap:8px;align-items:center;background:#f3f4fb;border-radius:11px;padding:7px 11px;font-weight:700}
.rank .r.mine{background:#fef3c7;outline:2px solid var(--am)}
.rank .n{font-family:'Jua';color:var(--in);text-align:center;font-size:18px}.rank .s{font-family:'Jua';font-size:19px}
.rank .w{font-size:12px;color:var(--dim)}.rank .del{background:var(--no);color:#fff;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:900}
.rank .empty{text-align:center;color:var(--dim);padding:16px;font-weight:500}
.status{font-size:12px;color:var(--dim);font-weight:500;text-align:center}
.rvh{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-weight:900}
.rvh button{font-size:12px;font-weight:900;border-radius:9px;padding:5px 10px;background:#eef0f8;color:#55607f;margin-left:4px}.rvh button.on{background:var(--in);color:#fff}
.review{display:grid;gap:8px;max-height:34vh;overflow-y:auto;margin-top:8px}
.rv{border-radius:14px;padding:11px 13px;border:1px solid #e3e7f3;background:#f8f9ff;font-size:13px}
.rv.x{background:#fff1f2;border-color:#fecdd3}.rv b{display:block;font-size:14px;margin:4px 0;word-break:keep-all}
.rv .a{color:#047857;font-weight:700}.rv .u{color:#be123c;font-weight:700;text-decoration:line-through}.rv .e{color:var(--dim);margin-top:4px;padding-top:4px;border-top:1px solid #e3e7f3;font-weight:500}

/* 2인 대결 */
.duel-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:10px}
.who{border-radius:16px;padding:8px 12px;color:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.who b{font-family:'Jua';font-weight:400;font-size:30px}.wa{background:linear-gradient(90deg,#f97316,#f59e0b)}.wb{background:linear-gradient(90deg,#06b6d4,#2563eb);flex-direction:row-reverse}
.dpads{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dpad{border-radius:20px;padding:10px;border:3px solid}.dpad.a{border-color:#fdba74;background:#fff7ed}.dpad.b{border-color:#7dd3fc;background:#f0f9ff}
.dpad .opts{grid-template-columns:1fr 1fr;gap:8px}.dpad .opt{padding:12px 9px;font-size:clamp(14px,1.9vw,18px);gap:8px}
.dpad.lock{opacity:.5}.dmsg{text-align:center;font-weight:900;min-height:1.5em;margin-top:6px;font-size:14px}
kbd{font:900 11px 'Noto Sans KR';background:#1e2440;color:#fff;border-radius:5px;padding:1px 6px}
@media (hover:none){kbd{display:none}}
.cf{position:fixed;top:-20px;width:11px;height:16px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#ask{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(15,18,45,.65);padding:16px}#ask.on{display:grid}
</style>
</head>
<body>
<div id="app">
  <div class="top"><button class="pill" id="homeB" style="visibility:hidden" onclick="askHome()">🏠 처음으로</button><button class="pill" id="sndB" onclick="toggleSound()">🔊 효과음 켜짐</button></div>

  <!-- 시작 -->
  <section class="screen card on center" id="sStart">
    <span class="tag">⚡ 상식 · 연산 · 아재개그 총출동!</span>
    <h1 class="jf">두뇌 풀가동!<br><span>트리플 퀴즈 쇼</span></h1>
    <p class="sub">지식, 암산 실력, 그리고 개그 센스까지! 세 가지 두뇌를 모두 깨워라!</p>
    <div class="modes">
      <button class="mode m1" onclick="go('sName')"><i>🏆</i><b>부스 도전</b><span>3라운드 12문제 · 랭킹 등록</span></button>
      <button class="mode m2" onclick="openFree()"><i>🎛️</i><b>자유 연습</b><span>분야·문제 수·시간 고르기</span></button>
      <button class="mode m3" onclick="startDuel()"><i>⚔️</i><b>2인 대결</b><span>같은 문제, 먼저 맞히면 승!</span></button>
    </div>
    <div class="trio"><div class="t1">🌏 상식 퀴즈</div><div class="t2">🧮 두뇌 연산</div><div class="t3">🤣 아재개그</div></div>
    <button class="btn ghost" onclick="openRank()">🏆 오늘의 랭킹 보기</button>
  </section>

  <!-- 이름 -->
  <section class="screen card center" id="sName">
    <h2 class="jf">부스 도전</h2>
    <p class="sub">1라운드 상식 → 2라운드 연산 → 3라운드 아재개그, 4문제씩 12문제!<br>빨리 맞히고 연속으로 맞힐수록 점수가 커져요.</p>
    <input id="nm" class="name" maxlength="8" placeholder="이름(별명)을 적어 주세요" autocomplete="off">
    <div class="row"><button class="btn" onclick="home()">⬅ 처음으로</button><button class="btn go" onclick="startRun()">도전 시작!</button></div>
  </section>

  <!-- 자유 연습 설정 -->
  <section class="screen card" id="sFree">
    <h2 class="jf center">자유 연습</h2>
    <label class="l">1. 분야</label><div class="seg c4" id="gCat"></div>
    <label class="l">2. 문제 수</label><div class="seg c3" id="gCnt"></div>
    <label class="l">3. 제한 시간</label><div class="seg c3" id="gDif"></div>
    <label class="l">4. 연산 수준</label><div class="seg c3" id="gLv"></div>
    <div class="row"><button class="btn" onclick="home()">⬅ 처음으로</button><button class="btn go" onclick="startFree()">시작하기!</button></div>
  </section>

  <!-- 라운드 안내 -->
  <section class="screen card round" id="sRound"><div class="big" id="rIco"></div><div class="tag" id="rTag"></div><h2 class="jf" id="rName"></h2><p class="sub" id="rDesc"></p></section>

  <!-- 퀴즈 -->
  <section class="screen card" id="sQuiz">
    <div class="qbar"><div><span class="badge b-n" id="qN"></span> <span class="badge" id="qCat"></span></div>
      <div><span class="badge b-combo" id="qCombo"></span> <span class="badge b-score">⭐ <span id="qScore">0</span>점</span></div></div>
    <div class="tt"><span>남은 시간</span><span id="tTxt"></span></div><div class="timer" id="tBar"><i></i></div>
    <div class="qcard"><div><small>QUESTION</small><div class="qtext" id="qText"></div></div></div>
    <div class="opts" id="qOpts"></div>
    <div class="life" id="life"><button id="l50" onclick="use50()">✂️ 50:50 찬스 (보기 2개 지우기)</button><button id="lT" onclick="useTime()">⏰ 시간 +10초 찬스</button></div>
    <div class="fb" id="fb"><b id="fbT"></b><p id="fbD"></p><button class="btn in" id="nextB" onclick="next()"></button></div>
  </section>

  <!-- 결과 -->
  <section class="screen card" id="sResult"></section>

  <!-- 2인 대결 -->
  <section class="screen card" id="sDuel">
    <div class="duel-top"><div class="who wa"><span>🟠 왼쪽</span><b id="dA">0</b></div><span class="badge b-n" id="dN"></span><div class="who wb"><span>오른쪽 🔵</span><b id="dB">0</b></div></div>
    <div class="qcard" style="margin-top:0"><div><small id="dCat"></small><div class="qtext" id="dText"></div></div></div>
    <div class="dpads"><div class="dpad a" id="padA"><div class="opts" id="oA"></div><div class="dmsg" id="mA"></div></div><div class="dpad b" id="padB"><div class="opts" id="oB"></div><div class="dmsg" id="mB"></div></div></div>
    <div class="fb" id="dFb"><b id="dFbT"></b><p id="dFbD" style="margin-bottom:0"></p></div>
  </section>
</div>
<div id="ask"><div class="card center" style="max-width:380px"><h2 class="jf">그만할까요?</h2><p class="sub">지금까지의 점수는 저장되지 않아요.</p><div class="row"><button class="btn" onclick="$('ask').classList.remove('on');resume()">계속 풀기</button><button class="btn in" onclick="$('ask').classList.remove('on');home()">처음으로</button></div></div></div>

<script src="board.js"></script>
<script>
// =====================================================
// 두뇌 풀가동! 트리플 퀴즈 쇼 (업그레이드판)
// 원작 아이디어: 상식·연산·아재개그 세 분야 퀴즈, 제한 시간, 콤보 점수, 해설, 오답 노트, 칭호
// =====================================================
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// ---------- 효과음 ----------
let AC=null,soundOn=true;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,type,d,when,v){if(!soundOn)return;try{audio();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
const SFX={click(){tone(520,'sine',.08,0,.1);},ok(){tone(523,'triangle',.12,0,.18);tone(659,'triangle',.12,.08,.18);tone(784,'triangle',.25,.16,.2);},
  no(){tone(220,'sawtooth',.18,0,.13);tone(175,'sawtooth',.28,.14,.13);},tick(){tone(880,'sine',.04,0,.06);},
  fan(){[523,659,784,1047].forEach((n,i)=>tone(n,'triangle',.22,i*.1,.18));},life(){tone(700,'square',.08,0,.08);tone(1050,'square',.12,.08,.08);}};
function toggleSound(){soundOn=!soundOn;$('sndB').textContent=soundOn?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';SFX.click();}

// ---------- 문제 은행 (맨 앞 보기가 정답, 낼 때마다 순서를 섞어요) ----------
const COMMON=[

    if(Math.random()<.5){ans=a+b;q=`${a} + ${b} = ?`;exp=`${a} + ${b} = ${ans}`;}else{const x=Math.max(a,b)+rnd(1,12),y=Math.min(a,b);ans=x-y;q=`${x} - ${y} = ?`;exp=`${x} - ${y} = ${ans}`;}}
  else if(t===1){const a=lv==='hard'?rnd(12,29):rnd(2,9),b=rnd(lv==='easy'?2:3,9);ans=a*b;q=`${a} × ${b} = ?`;exp=a>9?`${Math.floor(a/10)*10} × ${b} = ${Math.floor(a/10)*10*b}, ${a%10} × ${b} = ${a%10*b}. 둘을 더하면 ${ans}`:`${a} × ${b} = ${ans}`;}
  else if(t===2){const st=rnd(2,15),d=rnd(2,lv==='easy'?5:9),s=[0,1,2,3].map(i=>st+d*i);ans=st+d*4;q=`규칙을 찾아 빈칸에 알맞은 수를 고르세요.\n${s.join(' → ')} → ?`;exp=`${d}씩 커지는 규칙이에요. ${s[3]} + ${d} = ${ans}`;}
  else if(t===3){const b=rnd(2,lv==='hard'?12:9);ans=rnd(lv==='hard'?6:2,lv==='hard'?19:9);q=`${b*ans} ÷ ${b} = ?`;exp=`${b} × ${ans} = ${b*ans} 이니까 답은 ${ans}`;}
  else if(lv==='hard'){const x=rnd(5,19),m=rnd(3,8),a=rnd(5,24);ans=x;q=`□ × ${m} + ${a} = ${x*m+a}\n□에 들어갈 수는?`;exp=`(${x*m+a} - ${a}) ÷ ${m} = ${x*m} ÷ ${m} = ${x}`;}
  else{const a=rnd(5,25),b=rnd(2,9),c=rnd(2,9);if(Math.random()<.5){ans=a+b*c;q=`${a} + ${b} × ${c} = ?`;exp=`곱셈을 먼저 해요! ${b} × ${c} = ${b*c}, 여기에 ${a}을 더하면 ${ans}`;}else{const p=rnd(2,9),r=rnd(2,9);ans=(p+r)*c;q=`(${p} + ${r}) × ${c} = ?`;exp=`괄호 안을 먼저 해요! ${p} + ${r} = ${p+r}, 여기에 ${c}를 곱하면 ${ans}`;}}
  const set=new Set([ans]);for(const d of shuffle([-10,-2,-1,1,2,3,10,-3,5,-5])){if(set.size>=4)break;if(ans+d>0)set.add(ans+d);}
  return {cat:'math',q,opts:[...set].map(String),ans:String(ans),exp};
}
const CAT={common:{n:'상식 퀴즈',i:'🌏'},math:{n:'두뇌 연산',i:'🧮'},dad:{n:'아재개그',i:'🤣'}};

// ---------- 화면 ----------
let cur='sStart';
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));cur=id;
  $('homeB').style.visibility=['sQuiz','sDuel','sRound'].includes(id)?'visible':'hidden';$('app').classList.toggle('wide',id==='sDuel');
  if(id==='sName'){$('nm').classList.remove('need');setTimeout(()=>$('nm').focus(),50);}scrollTo(0,0);}
function home(){stopTimer();clearTimeout(dT);G=null;D=null;MODAL='';$('nm').value='';go('sStart');}
function askHome(){SFX.click();paused=true;$('ask').classList.add('on');}
function resume(){paused=false;last=performance.now();}

// ---------- 자유 연습 설정 ----------
const F={cat:'mixed',cnt:10,sec:15,lv:'mid'};
const SEG={gCat:['cat',[['mixed','🔀 전체 혼합'],['common','🌏 상식'],['math','🧮 연산'],['dad','🤣 아재개그']]],gCnt:['cnt',[[5,'5문제'],[10,'10문제'],[15,'15문제']]],
  gDif:['sec',[[20,'여유 (20초)'],[15,'보통 (15초)'],[10,'스피드 (10초)']]],gLv:['lv',[['easy','쉬움 (1~2학년)'],['mid','보통 (3~4학년)'],['hard','어려움 (5~6학년)']]]};
function drawSeg(){for(const id in SEG){const [k,list]=SEG[id];$(id).innerHTML=list.map(([v,t])=>`<button class="${F[k]===v?'on':''}" onclick="F.${k}=${JSON.stringify(v).replace(/"/g,"'")};SFX.click();drawSeg()">${t}</button>`).join('');}}
function openFree(){SFX.click();drawSeg();go('sFree');}

// ---------- 한 판 ----------
let G=null,paused=false,raf=0,last=0;
const ready=q=>({...q,opts:shuffle(q.opts)});
function build(cat,n,lv){
  const c=shuffle(pack(COMMON,'common')),d=shuffle(pack(DAD,'dad')),out=[];
  for(let i=0;i<n;i++){const k=cat==='mixed'?['common','math','dad'][i%3]:cat;out.push(ready(k==='common'?c.pop():k==='dad'?d.pop():mathQ(lv)));}
  return cat==='mixed'?shuffle(out):out;
}
function startRun(){
  const el=$('nm'),name=el.value.trim();
  if(!name){el.classList.remove('need');void el.offsetWidth;el.classList.add('need');el.placeholder='✏️ 이름(별명)을 먼저 적어 주세요!';el.focus();return;}
  audio();SFX.click();
  const c=shuffle(pack(COMMON,'common')).slice(0,4),d=shuffle(pack(DAD,'dad')).slice(0,4),m=[0,1,2,3].map(()=>mathQ('mid'));
  begin({mode:'run',name,sec:15,qs:[...c,...m,...d].map(ready)});
}
function startFree(){audio();SFX.click();begin({mode:'free',sec:F.sec,qs:build(F.cat,F.cnt,F.lv)});}
function begin(o){G={...o,i:0,score:0,combo:0,best:0,correct:0,hist:[],l50:true,lT:true,t0:Date.now(),id:null};roundOrQ();}
const ROUND=[['🌏','1 라운드','상식 퀴즈','알고 있는 것을 떠올려 봐요!'],['🧮','2 라운드','두뇌 연산','침착하게 계산해요!'],['🤣','3 라운드','아재개그','센스를 발휘할 시간!']];
function roundOrQ(){
  if(G.mode==='run'&&G.i%4===0){const r=ROUND[G.i/4];$('rIco').textContent=r[0];$('rTag').textContent=r[1];$('rName').textContent=r[2];$('rDesc').textContent=r[3];go('sRound');SFX.life();
    const g=G;setTimeout(()=>{if(G===g&&cur==='sRound')showQ();},1700);}
  else showQ();
}
function showQ(){
  const q=G.qs[G.i];G.done=false;G.left=G.sec;G.tick=4;
  go('sQuiz');
  $('qN').textContent=`${G.i+1} / ${G.qs.length}`;$('qCat').className='badge cat-'+q.cat;$('qCat').textContent=`${CAT[q.cat].i} ${CAT[q.cat].n}`;
  $('qScore').textContent=G.score.toLocaleString();const cb=$('qCombo');cb.classList.toggle('on',G.combo>=2);cb.textContent=`🔥 ${G.combo}콤보!`;
  $('qText').textContent=q.q;$('fb').className='fb';
  $('qOpts').innerHTML=q.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pick(${k})"><em>${'ABCD'[k]}</em><span>${esc(o)}</span></button>`).join('');
  $('life').style.display='flex';$('l50').classList.toggle('used',!G.l50);$('lT').classList.toggle('used',!G.lT);
  stopTimer();last=performance.now();paused=false;raf=requestAnimationFrame(tickT);drawT();
}
function stopTimer(){cancelAnimationFrame(raf);}
function tickT(now){
  if(!G||G.done)return;
  if(!paused){G.left-=(now-last)/1000;const c=Math.ceil(G.left);if(c<=3&&c<G.tick&&c>0){SFX.tick();G.tick=c;}}
  last=now;
  if(G.left<=0){G.left=0;drawT();return pick(-1);}
  drawT();raf=requestAnimationFrame(tickT);
}
function drawT(){const p=Math.max(0,G.left/G.sec*100);$('tBar').firstElementChild.style.width=Math.min(100,p)+'%';$('tBar').className='timer'+(p<=25?' low':p<=50?' mid':'');$('tTxt').textContent=G.left.toFixed(1)+'초';}
function use50(){if(!G||G.done||!G.l50)return;G.l50=false;SFX.life();const q=G.qs[G.i];
  const wrong=shuffle([...$('qOpts').children].filter(b=>q.opts[b.dataset.k]!==q.ans)).slice(0,2);wrong.forEach(b=>b.classList.add('gone'));$('l50').classList.add('used');}
function useTime(){if(!G||G.done||!G.lT)return;G.lT=false;SFX.life();G.left+=10;G.sec=Math.max(G.sec,G.left);$('lT').classList.add('used');drawT();}
function pick(k){
  if(!G||G.done)return;G.done=true;stopTimer();
  const q=G.qs[G.i],ok=k>=0&&q.opts[k]===q.ans;let earn=0;
  [...$('qOpts').children].forEach((b,i)=>{b.disabled=true;if(q.opts[i]===q.ans)b.classList.add('ok');else if(i===k)b.classList.add('no');else b.classList.add('dim');});
  if(ok){SFX.ok();G.correct++;G.combo++;G.best=Math.max(G.best,G.combo);earn=100+Math.round(Math.min(1,G.left/15)*30)+(G.combo-1)*15;G.score+=earn;$('qScore').textContent=G.score.toLocaleString();}
  else{SFX.no();G.combo=0;}
  G.hist.push({q,user:k<0?null:q.opts[k],ok});
  $('life').style.display='none';
  $('fb').className='fb on '+(ok?'good':'bad');
  $('fbT').textContent=ok?(G.combo>=2?`⭕ 정답! 🔥 ${G.combo}콤보 (+${earn}점)`:`⭕ 정답! (+${earn}점)`):k<0?'⏰ 앗, 시간이 다 됐어요!':'❌ 아쉬워요! 정답은 초록색 보기예요.';
  $('fbD').textContent=q.exp;$('nextB').textContent=G.i===G.qs.length-1?'결과 보기 🏁':'다음 문제 ➡';
}
function next(){SFX.click();G.i++;if(G.i<G.qs.length)roundOrQ();else finish();}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||$('ask').classList.contains('on'))return;
  if(cur==='sQuiz'&&G){const k=['Digit1','Digit2','Digit3','Digit4'].indexOf(e.code),k2=['KeyA','KeyB','KeyC','KeyD'].indexOf(e.code),i=k>=0?k:k2;
    if(!G.done&&i>=0){const b=$('qOpts').children[i];if(b&&!b.classList.contains('gone'))pick(i);}
    else if(G.done&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();next();}}
  if(cur==='sDuel'&&D&&D.open){const a=['KeyQ','KeyW','KeyA','KeyS'].indexOf(e.code),b=['KeyO','KeyP','KeyK','KeyL'].indexOf(e.code);if(a>=0)dPick(0,a);if(b>=0)dPick(1,b);}
});

// ---------- 결과 ----------
let MODAL='',RV='wrong';
function finish(){
  SFX.fan();const n=G.qs.length,acc=Math.round(G.correct/n*100);G.acc=acc;
  if(G.mode==='run')G.id=Board.submit({name:G.name,score:G.score,c:G.correct,t:Date.now()-G.t0});
  if(acc>=80)confetti();
  RV=G.hist.some(h=>!h.ok)?'wrong':'all';renderResult();go('sResult');
}
function renderResult(){
  const n=G.qs.length,acc=G.acc,run=G.mode==='run';
  const T=acc===100?['👑','전설의 퀴즈 마스터!','한 문제도 놓치지 않았어요. 완벽해요!']:acc>=80?['🏆','브레인 챔피언!','대단한 실력이에요! 어떤 문제도 거뜬하네요.']:acc>=50?['🏅','센스 만점 도전자','잘했어요! 오답 노트를 보고 만점에 도전해 봐요.']:['🌱','쑥쑥 크는 퀴즈 새싹','연습은 끝! 해설을 기억하고 다시 도전해 봐요.'];
  const rows=run?rankRows():[],ids=[G.id],my=rows.findIndex(r=>Board.isMine(r,ids));
  const items=RV==='wrong'?G.hist.filter(h=>!h.ok):G.hist;
  $('sResult').innerHTML=`<div class="center"><div class="medal">${T[0]}</div><span class="tag">${run?esc(G.name)+' 님의 칭호':'오늘의 칭호'}</span><h2 class="jf" style="margin-top:6px">${T[1]}</h2><p class="sub" style="margin-bottom:0">${T[2]}</p></div>
    <div class="stats"><div class="s1">최종 점수<b>${G.score.toLocaleString()}</b></div><div class="s2">정답률<b>${acc}%</b>(${G.correct} / ${n})</div><div class="s3">최대 콤보<b>${G.best}연속</b></div></div>
    ${run?`<div class="me">${my>=0?`🏅 오늘 ${rows.length}명 중 ${my+1}등!`:''}</div>${rankList(rows,5,ids)}<div class="status">${statusText()}</div>`:''}
    <div class="rvh"><span>📖 ${RV==='wrong'?'오답 노트':'전체 문제 풀이'}</span><span><button class="${RV==='wrong'?'on':''}" onclick="RV='wrong';renderResult()">틀린 문제만</button><button class="${RV==='all'?'on':''}" onclick="RV='all';renderResult()">전체 보기</button></span></div>
    <div class="review">${items.length?items.map(h=>`<div class="rv ${h.ok?'':'x'}"><span class="badge cat-${h.q.cat}">${CAT[h.q.cat].i} ${CAT[h.q.cat].n}</span> ${h.ok?'⭕':'❌'}<b>${esc(h.q.q).replace(/\n/g,' ')}</b>${h.ok?'':`<div>내 답: <span class="u">${h.user===null?'시간 초과':esc(h.user)}</span></div>`}<div class="a">정답: ${esc(h.q.ans)}</div><div class="e">${esc(h.q.exp)}</div></div>`).join(''):'<div class="rv center">틀린 문제가 하나도 없어요! 퍼펙트! 🎉</div>'}</div>
    <div class="row">${run?'<button class="btn" onclick="openRank()">랭킹 전체 보기</button>':'<button class="btn in" onclick="startFree()">같은 설정으로 다시</button>'}<button class="btn go" style="font-size:20px" onclick="home()">처음으로</button></div>`;
  MODAL='result';
}
function confetti(){for(let i=0;i<70;i++){const s=document.createElement('i');s.className='cf';s.style.left=Math.random()*100+'vw';s.style.background=['#fbbf24','#ec4899','#6366f1','#10b981','#38bdf8'][i%5];s.style.animationDuration=1.6+Math.random()*1.8+'s';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4200);}}

// ---------- 랭킹 ----------
const STUB={online:false,user:null,today:()=>[],submit:()=>null,isMine:()=>false,onChange(){},init(){},login(){},remove(){},clearToday(){}};
const Board=typeof createBoard==='function'?createBoard('quiz'):STUB;
let MANAGE=false;
const rankRows=()=>Board.today().slice().sort((a,b)=>b.score-a.score||a.t-b.t||a.at-b.at);
function rankList(rows,limit,ids){
  if(!rows.length)return `<div class="rank"><div class="empty">아직 기록이 없어요. 첫 번째 도전자가 되어 보세요!</div></div>`;
  return `<div class="rank">${rows.slice(0,limit).map((r,i)=>`<div class="r ${Board.isMine(r,ids)?'mine':''}"><span class="n">${i+1}</span><span>${esc(r.name)}</span><span class="w">${r.c} / 12 정답</span><span class="s">${Number(r.score).toLocaleString()}${MANAGE?` <button class="del" onclick="delRow(${i})">✕</button>`:''}</span></div>`).join('')}</div>`;
}
const statusText=()=>Board.online?'🟢 오늘 부스에서 도전한 모든 친구의 랭킹이에요':'🟡 이 기기에서 한 기록만 보여요';
function openRank(){
  SFX.click();const rows=rankRows(),ids=G&&G.id?[G.id]:[];
  $('sResult').innerHTML=`<h2 class="jf center">🏆 오늘의 랭킹</h2>${rankList(rows,30,ids)}<div class="status">${statusText()}</div>
    <div class="row"><button class="btn ghost" onclick="toggleManage()">${MANAGE?'관리 끝내기':'선생님 관리'}</button>${MANAGE&&rows.length?'<button class="btn ghost" onclick="clearRank()">오늘 기록 모두 지우기</button>':''}</div><div class="row"><button class="btn in" onclick="closeRank()">닫기</button></div>`;
  MODAL='rank';go('sResult');
}
function closeRank(){MANAGE=false;if(G&&G.id){renderResult();}else home();}
async function toggleManage(){
  if(!MANAGE&&Board.online&&!Board.user){try{await Board.login();}catch(e){alert('선생님 계정으로 로그인해야 기록을 지울 수 있어요.');return;}}
  MANAGE=!MANAGE;openRank();
}
async function delRow(i){const r=rankRows()[i];if(!r||!confirm(`"${r.name}" 기록을 지울까요?`))return;try{await Board.remove(r);}catch(e){alert('지우지 못했어요. 선생님 계정인지 확인해 주세요.');}openRank();}
async function clearRank(){if(!confirm('오늘 기록을 모두 지울까요? 되돌릴 수 없어요.'))return;try{await Board.clearToday();}catch(e){alert('지우지 못했어요. 선생님 계정인지 확인해 주세요.');}openRank();}
Board.onChange(()=>{if(cur!=='sResult')return;if(MODAL==='rank')openRank();else if(MODAL==='result'&&G&&G.id)renderResult();});
// 랭킹 서버에 이 게임 칸이 열려 있을 때만 연결해요. 아니면 이 기기에 저장해 두어요.
(async()=>{try{if(typeof loadFirebase!=='function')return;const f=await loadFirebase();await f.fs.getDocs(f.fs.query(f.fs.collection(f.db,'quiz'),f.fs.limit(1)));await Board.init();}catch(e){console.warn('공용 랭킹에 연결하지 못해 이 기기에만 저장해요',e);}})();

// ---------- 2인 대결: 같은 문제를 동시에! 먼저 맞히는 사람이 1점 ----------
let D=null,dT=0;
const DKEY=[['Q','W','A','S'],['O','P','K','L']];
function startDuel(){audio();SFX.click();D={qs:build('mixed',7,'easy'),i:0,s:[0,0]};go('sDuel');dShow();}
function dShow(){
  const q=D.qs[D.i];D.open=true;D.lock=[false,false];
  $('dN').textContent=`${D.i+1} / ${D.qs.length}`;$('dA').textContent=D.s[0];$('dB').textContent=D.s[1];
  $('dCat').textContent=`${CAT[q.cat].i} ${CAT[q.cat].n}`;$('dText').textContent=q.q;$('dFb').className='fb';
  [0,1].forEach(p=>{$(p?'oB':'oA').innerHTML=q.opts.map((o,k)=>`<button class="opt" onpointerdown="dPick(${p},${k})"><em><kbd>${DKEY[p][k]}</kbd></em><span>${esc(o)}</span></button>`).join('');$(p?'padB':'padA').classList.remove('lock');$(p?'mB':'mA').textContent='';});
}
function dPick(p,k){
  if(!D||!D.open||D.lock[p])return;const q=D.qs[D.i],btn=$(p?'oB':'oA').children[k];
  if(q.opts[k]===q.ans){D.s[p]++;SFX.ok();btn.classList.add('ok');$(p?'mB':'mA').textContent='⭕ 먼저 맞혔어요! +1점';dEnd(`${p?'🔵 오른쪽':'🟠 왼쪽'} 선수 득점!`);}
  else{D.lock[p]=true;SFX.no();btn.classList.add('no');$(p?'padB':'padA').classList.add('lock');$(p?'mB':'mA').textContent='❌ 땡! 이번 문제는 쉬어요';if(D.lock[0]&&D.lock[1])dEnd('둘 다 땡! 이번 문제는 점수가 없어요.');}
}
function dEnd(msg){
  D.open=false;const q=D.qs[D.i];$('dA').textContent=D.s[0];$('dB').textContent=D.s[1];
  $('dFb').className='fb on good';$('dFbT').textContent=`${msg} 정답: ${q.ans}`;$('dFbD').textContent=q.exp;
  const d=D;dT=setTimeout(()=>{if(D!==d)return;D.i++;if(D.i<D.qs.length&&Math.max(...D.s)<4)dShow();else dResult();},2800);
}
function dResult(){
  SFX.fan();confetti();const [a,b]=D.s,w=a===b?'무승부!':a>b?'🟠 왼쪽 선수 승리!':'🔵 오른쪽 선수 승리!';
  $('sResult').innerHTML=`<div class="center"><div class="medal">${a===b?'🤝':'🏆'}</div><h2 class="jf">${w}</h2><p class="sub">멋진 승부였어요!</p></div>
    <div class="stats" style="grid-template-columns:1fr 1fr"><div class="s3">🟠 왼쪽<b>${a}점</b></div><div class="s1">🔵 오른쪽<b>${b}점</b></div></div>
    <div class="row"><button class="btn in" onclick="startDuel()">다시 대결!</button><button class="btn go" style="font-size:20px" onclick="home()">처음으로</button></div>`;
  MODAL='';go('sResult');
}
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')startRun();});
</script>
